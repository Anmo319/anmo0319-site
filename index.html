<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f6fa" />
    <script>
      (() => {
        let mode = "system";
        try {
          mode =
            JSON.parse(
              localStorage.getItem("anmo.settings.v2") ||
                localStorage.getItem("anmo.settings.v1") ||
                "{}",
            ).themeMode || "system";
        } catch {}
        const theme =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      html {
        background: #f5f6fa;
      }
      html[data-theme="dark"] {
        background: #11131c;
      }
    </style>
    <title>Anmo 2.3 · 安莫</title>
    <script type="module" crossorigin src="/assets/index-D8OO9Ibs.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/theme-u1afJCFX.js">
    <link rel="modulepreload" crossorigin href="/assets/cloudStorage-f-t4vmj0.js">
    <link rel="stylesheet" crossorigin href="/assets/index-DKenZJe2.css">
  </head>
  <body>
    <div id="root">
      <div
        id="startup-status"
        role="status"
        style="padding: 24px; font: 16px system-ui; color: #888"
      >
        <p>正在打开安莫…</p>
        <button
          id="startup-retry"
          hidden
          style="min-width: 44px; min-height: 44px; font: inherit"
        >
          重新打开
        </button>
      </div>
    </div>
    <script>
      (() => {
        const status = document.getElementById("startup-status");
        const retry = document.getElementById("startup-retry");
        const recover = () => {
          if (!status.isConnected) return;
          status.querySelector("p").textContent =
            "打开暂未完成，请检查网络后重试。现有内容会保留。";
          retry.hidden = false;
        };
        retry.addEventListener("click", () => location.reload());
        window.addEventListener("error", recover);
        window.addEventListener("unhandledrejection", recover);
        setTimeout(recover, 15000);
      })();
    </script>
  </body>
</html>
