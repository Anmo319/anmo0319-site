<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimal Test</title></head>
<body>
<div id="root"><p>如果看到这行字，说明 HTML 正常</p></div>
<script type="module">
import React from 'https://esm.sh/react@18';
import { createRoot } from 'https://esm.sh/react-dom@18/client';
console.log('React loaded, trying to render...');
try {
  createRoot(document.getElementById('root')).render(React.createElement('h1', null, 'React 渲染成功！'));
  console.log('Render called');
} catch (e) {
  document.getElementById('root').innerHTML = '<p style="color:red">渲染失败: ' + e.message + '</p>';
}
</script>
</body></html>
